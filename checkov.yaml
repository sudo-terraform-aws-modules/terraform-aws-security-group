compact: true
quiet: true
framework:
  - terraform

# Examples are demonstration configs - not production hardened.
# Strict security checks run only on the module root.
skip-path:
  - examples/

# Every skip below has been verified by running checkov with the skip removed
# and confirming the check actually fires.
skip-check:
  - CKV2_AWS_5  # The module exports the security group ID via `output "id"` for callers to attach to downstream resources (EC2, ALB, RDS, etc.). Attachment happens outside the module and cannot be demonstrated here.
