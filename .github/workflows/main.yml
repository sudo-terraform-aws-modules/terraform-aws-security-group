on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

name: Terraform CI

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: pre-commit
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - uses: hashicorp/setup-terraform@v4

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Install terraform-docs
        env:
          TERRAFORM_DOCS_VERSION: v0.24.0
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          sudo mv /tmp/terraform-docs /usr/local/bin/

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        # terraform_validate needs provider initialization; the terraform test job rejects
        # invalid configuration instead.
        # terraform_docs fails the job when the README tables are stale; run `make docs`.
        # no-commit-to-branch is a local guard only - not meaningful in CI.
        run: |
          SKIP=terraform_validate,no-commit-to-branch pre-commit run --all-files
          # Scoped to the one pre-push hook. `--hook-stage pre-push` without a hook id
          # re-runs every hook that does not restrict its stages, doubling the job.
          pre-commit run protect-default-branches --all-files --hook-stage pre-push

  checkov:
    runs-on: ubuntu-latest
    name: checkov
    steps:
      - uses: actions/checkout@v6

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: checkov.yaml
          quiet: true
          soft_fail: false
          download_external_modules: true

  test:
    runs-on: ubuntu-latest
    name: terraform test
    steps:
      - uses: actions/checkout@v6

      # Mock providers need Terraform 1.7+; this does not raise the module's minimum version.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.10"

      - name: Run unit tests
        run: |
          terraform init -backend=false -input=false
          terraform test
